# VR Bot by VR DEVELOPMENTS — the worker. "Always on": one run stays connected all the time and
# sends ON THE MINUTE. Before a run ends it starts the next one, so GitHub's (unreliable) timer is
# not needed for timing. The Watchdog workflow restarts the chain if it ever stops.
# You normally never touch this file.
name: VR Bot — Run

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'What to do'
        type: choice
        options: [run, test-send, send-now]
        default: run
      target:
        description: 'Schedule ID (only for test-send / send-now)'
        required: false
        default: ''
      lookahead:
        description: 'Minutes to look ahead (leave empty for the default)'
        required: false
        default: ''
      via:
        description: 'Leave empty (used by the bot itself)'
        required: false
        default: ''
  repository_dispatch:
    types: [vr-alert, contact-form]
  workflow_run:
    # Right after you link WhatsApp again, start the bot (pairing pauses the always-on chain).
    workflows: ['VR Bot — Pair WhatsApp']
    types: [completed]

permissions:
  contents: write   # save encrypted state to the vr-state / vr-media branches
  actions: write    # start the next run (always on)

concurrency:
  group: vr-bot-whatsapp     # only one WhatsApp connection at a time (shared with the pairing workflow)
  cancel-in-progress: false  # GitHub keeps at most ONE waiting run in this group, so runs never pile up

jobs:
  run:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --omit=dev --no-audit --no-fund

      - name: Run VR Bot
        timeout-minutes: 95
        run: node src/index.js run
        env:
          VR_PASSPHRASE: ${{ secrets.VR_PASSPHRASE }}
          BOT_NUMBER: ${{ secrets.BOT_NUMBER }}
          OWNER_NUMBER: ${{ secrets.OWNER_NUMBER }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          VR_ACTION: ${{ inputs.action || 'run' }}
          VR_TARGET: ${{ inputs.target }}
          VR_LOOKAHEAD: ${{ inputs.lookahead }}
          VR_VIA: ${{ inputs.via }}

      - name: Save session & state (always runs, even after an error)
        if: always()
        timeout-minutes: 5
        run: node src/index.js save
        env:
          VR_PASSPHRASE: ${{ secrets.VR_PASSPHRASE }}

      - name: Always on — start the next run
        if: always()
        timeout-minutes: 3
        run: node src/chain.js next
        env:
          GITHUB_TOKEN: ${{ github.token }}
