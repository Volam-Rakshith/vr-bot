# VR Bot by VR DEVELOPMENTS — publishes the control panel (panel/ folder) to GitHub Pages.
name: VR Bot — Publish panel

on:
  push:
    branches: [main]
    paths: ['panel/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: panel
      - id: deployment
        uses: actions/deploy-pages@v5
