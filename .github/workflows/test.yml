# VR Bot by VR DEVELOPMENTS — checks the code on every push (does not touch WhatsApp).
name: VR Bot — Tests

on:
  push:
    paths: ['src/**', 'panel/shared/**', 'test/**', 'package.json']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm test
